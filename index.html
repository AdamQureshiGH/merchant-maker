<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merchant Maker</title>

    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

<script>
async function startGame() {
    await cheerpjInit({
        version: 17
    });

    cheerpjCreateDisplay(800, 600);

    await cheerpjRunJar("/app/merchant-maker/game.jar");
}

window.onload = startGame;
</script>

</body>
</html>
